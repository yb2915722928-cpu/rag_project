[project]
name = "rag-all-backend"
version = "0.1.0"
description = "Rebuildable modular backend baseline for RAG_all"
requires-python = "==3.12.8"
dependencies = [
  "alembic==1.20.0",
  "argon2-cffi==25.1.0",
  "cryptography==50.0.2",
  "fastapi==0.143.2",
  "httpx==0.28.1",
  "pydantic==2.14.1",
  "pydantic-settings==2.11.0",
  "psycopg[binary]==3.3.6",
  "sqlalchemy==2.0.54",
  "uvicorn==0.37.0",
]

[dependency-groups]
dev = ["pytest==8.4.2", "pytest-cov==7.0.0"]

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rag_app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

