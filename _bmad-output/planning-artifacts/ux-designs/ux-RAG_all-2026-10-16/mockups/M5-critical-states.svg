<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1040" viewBox="0 0 1600 1040" role="img" aria-label="M5 / 等待、失联、失权与知情重交的组件状态"><title>M5 / 等待、失联、失权与知情重交的组件状态</title>
<rect width="1600" height="1040" fill="#F2F3F5"/>
<rect x="0" y="0" width="1600" height="40" rx="4" fill="#303133" stroke="none" stroke-width="1"/>
<text x="24" y="10" font-family="Microsoft YaHei, sans-serif" font-size="14" font-weight="600" fill="#FFFFFF" dominant-baseline="text-before-edge">M5 / 等待、失联、失权与知情重交的组件状态</text>
<text x="1352" y="10" font-family="Microsoft YaHei, sans-serif" font-size="13" font-weight="400" fill="#FFFFFF" dominant-baseline="text-before-edge">模拟资料 · 设计参考 · 非运行结果</text>
<rect x="24" y="72" width="752" height="236" rx="4" fill="#FFFFFF" stroke="#DCDFE6" stroke-width="1"/>
<text x="48" y="92" font-family="Microsoft YaHei, sans-serif" font-size="16" font-weight="600" fill="#303133" dominant-baseline="text-before-edge">A / 已受理等待</text>
<rect x="800" y="72" width="776" height="236" rx="4" fill="#FFFFFF" stroke="#DCDFE6" stroke-width="1"/>
<text x="824" y="92" font-family="Microsoft YaHei, sans-serif" font-size="16" font-weight="600" fill="#303133" dominant-baseline="text-before-edge">B / 连接中断，结果待确认</text>
<rect x="24" y="332" width="752" height="236" rx="4" fill="#FFFFFF" stroke="#DCDFE6" stroke-width="1"/>
<text x="48" y="352" font-family="Microsoft YaHei, sans-serif" font-size="16" font-weight="600" fill="#303133" dominant-baseline="text-before-edge">C / 当前资源不可用</text>
<rect x="800" y="332" width="776" height="636" rx="4" fill="#FFFFFF" stroke="#DCDFE6" stroke-width="1"/>
<text x="824" y="352" font-family="Microsoft YaHei, sans-serif" font-size="16" font-weight="600" fill="#303133" dominant-baseline="text-before-edge">D / 重新提交解析的确认对话框</text>
<text x="48" y="144" font-family="Microsoft YaHei, sans-serif" font-size="18" font-weight="600" fill="#303133" dominant-baseline="text-before-edge">正在处理本次问题。</text>
<text x="48" y="190" font-family="Microsoft YaHei, sans-serif" font-size="14" font-weight="400" fill="#606266" dominant-baseline="text-before-edge">在原操作截止前等待完整结果；不显示未校验草稿。</text>
<rect x="48" y="244" width="150" height="26" rx="4" fill="#F4F4F5" stroke="none" stroke-width="1"/>
<text x="58" y="249" font-family="Microsoft YaHei, sans-serif" font-size="13" font-weight="400" fill="#606266" dominant-baseline="text-before-edge">当前会话暂不能再提交</text>
<text x="824" y="144" font-family="Microsoft YaHei, sans-serif" font-size="18" font-weight="600" fill="#303133" dominant-baseline="text-before-edge">尚未确认本次结果。</text>
<text x="824" y="190" font-family="Microsoft YaHei, sans-serif" font-size="14" font-weight="400" fill="#606266" dominant-baseline="text-before-edge">查看原操作状态，不会重新生成或重复扣次。</text>
<rect x="824" y="244" width="152" height="32" rx="4" fill="#1D6CC0" stroke="#1D6CC0" stroke-width="1"/>
<text x="840" y="251" font-family="Microsoft YaHei, sans-serif" font-size="14" font-weight="400" fill="#FFFFFF" dominant-baseline="text-before-edge">查看原操作</text>
<text x="48" y="408" font-family="Microsoft YaHei, sans-serif" font-size="18" font-weight="600" fill="#303133" dominant-baseline="text-before-edge">所选资源不可用。</text>
<text x="48" y="452" font-family="Microsoft YaHei, sans-serif" font-size="14" font-weight="400" fill="#606266" dominant-baseline="text-before-edge">请重新选择范围，当前不可用内容不会继续显示。</text>
<rect x="48" y="508" width="168" height="32" rx="4" fill="#FFFFFF" stroke="#767A82" stroke-width="1"/>
<text x="64" y="515" font-family="Microsoft YaHei, sans-serif" font-size="14" font-weight="400" fill="#1D6CC0" dominant-baseline="text-before-edge">重新选择范围</text>
<rect x="824" y="408" width="728" height="520" rx="4" fill="#F2F3F5" stroke="none" stroke-width="1"/>
<rect x="872" y="452" width="632" height="432" rx="4" fill="#FFFFFF" stroke="#DCDFE6" stroke-width="1"/>
<text x="896" y="472" font-family="Microsoft YaHei, sans-serif" font-size="16" font-weight="600" fill="#303133" dominant-baseline="text-before-edge">重新提交解析？</text>
<text x="896" y="512" font-family="Microsoft YaHei, sans-serif" font-size="16" font-weight="400" fill="#303133" dominant-baseline="text-before-edge">当前外部解析结果仍待核对。重新提交可能产生重复调用与额外费用，原任务状态</text>
<text x="896" y="538" font-family="Microsoft YaHei, sans-serif" font-size="16" font-weight="400" fill="#303133" dominant-baseline="text-before-edge">不会因此撤销。</text>
<rect x="896" y="612" width="584" height="80" rx="4" fill="#FDF6EC" stroke="none" stroke-width="1"/>
<text x="912" y="630" font-family="Microsoft YaHei, sans-serif" font-size="14" font-weight="400" fill="#8A5A00" dominant-baseline="text-before-edge">你也可以先“继续核对”，只读取原任务状态和费用。</text>
<rect x="896" y="724" width="18" height="18" rx="4" fill="#FFFFFF" stroke="#767A82" stroke-width="1"/>
<text x="926" y="724" font-family="Microsoft YaHei, sans-serif" font-size="14" font-weight="400" fill="#303133" dominant-baseline="text-before-edge">我已知悉可能重复调用与费用</text>
<rect x="1064" y="808" width="136" height="32" rx="4" fill="#FFFFFF" stroke="#767A82" stroke-width="1"/>
<text x="1080" y="815" font-family="Microsoft YaHei, sans-serif" font-size="14" font-weight="400" fill="#1D6CC0" dominant-baseline="text-before-edge">返回核对</text>
<rect x="1216" y="808" width="264" height="32" rx="4" fill="#F5F7FA" stroke="#DCDFE6" stroke-width="1"/>
<text x="1232" y="815" font-family="Microsoft YaHei, sans-serif" font-size="14" font-weight="400" fill="#909399" dominant-baseline="text-before-edge">确认并重新提交解析</text>
<text x="48" y="628" font-family="Microsoft YaHei, sans-serif" font-size="18" font-weight="600" fill="#303133" dominant-baseline="text-before-edge">状态表达规则</text>
<text x="48" y="678" font-family="Microsoft YaHei, sans-serif" font-size="16" font-weight="400" fill="#303133" dominant-baseline="text-before-edge">加载、断网、业务失败、正常不足与无权是不同事实。提示写明影响和当前合法动作；不依赖短</text>
<text x="48" y="704" font-family="Microsoft YaHei, sans-serif" font-size="16" font-weight="400" fill="#303133" dominant-baseline="text-before-edge">暂消息，不用自动新请求掩盖未知结果。</text>
<text x="48" y="800" font-family="Microsoft YaHei, sans-serif" font-size="14" font-weight="400" fill="#606266" dominant-baseline="text-before-edge">焦点样例</text>
<rect x="44" y="840" width="180" height="40" rx="4" fill="#FFFFFF" stroke="#1D6CC0" stroke-width="2"/>
<rect x="48" y="844" width="172" height="32" rx="4" fill="#FFFFFF" stroke="#767A82" stroke-width="1"/>
<text x="64" y="851" font-family="Microsoft YaHei, sans-serif" font-size="14" font-weight="400" fill="#1D6CC0" dominant-baseline="text-before-edge">安全返回</text>
<text x="48" y="916" font-family="Microsoft YaHei, sans-serif" font-size="14" font-weight="400" fill="#606266" dominant-baseline="text-before-edge">失权提示不泄露未知目标标题、数量或存在性。</text>
</svg>