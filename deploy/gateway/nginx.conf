worker_processes 1;
pid /tmp/nginx.pid;
# Nginx request errors can contain URLs, so ordinary request logging is disabled.
error_log /dev/null crit;

events { worker_connections 256; }

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log off;
    sendfile on;
    server_tokens off;
    client_max_body_size 1m;
    client_body_timeout 15s;
    client_header_timeout 10s;
    send_timeout 30s;

    upstream rag_api { server api:8000; }
    map $status $public_asset_cache {
        default "no-store";
        ~^2 "public, max-age=31536000, immutable";
    }

    server {
        listen 8443 ssl;
        ssl_certificate /run/tls/cert.pem;
        ssl_certificate_key /run/tls/key.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        root /usr/share/nginx/html;
        error_page 404 = @gateway_private_404;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
        etag off;
        if_modified_since off;

        # Hashed public build assets are the only cacheable surface.
        location ~ ^/assets/[A-Za-z0-9_-]+-[A-Za-z0-9_-]{8,}\.(?:css|js|png|jpg|jpeg|svg|woff2)$ {
            try_files $uri =404;
            add_header Cache-Control $public_asset_cache always;
            add_header X-Content-Type-Options "nosniff" always;
        }

        # Every API response, including gateway errors, is private and uncached.
        location /api/ {
            proxy_pass http://rag_api;
            proxy_http_version 1.1;
            proxy_buffering off;
            proxy_request_buffering off;
            proxy_max_temp_file_size 0;
            proxy_next_upstream off;
            proxy_read_timeout 30s;
            proxy_send_timeout 30s;
            proxy_connect_timeout 3s;
            proxy_cache off;
            proxy_no_cache 1;
            proxy_cache_bypass 1;
            proxy_set_header Host $host;
            proxy_set_header X-Request-ID $request_id;
            proxy_hide_header ETag;
            proxy_hide_header Last-Modified;
            proxy_hide_header Cache-Control;
            proxy_hide_header Expires;
            proxy_ignore_headers X-Accel-Redirect X-Accel-Expires;
            proxy_set_header If-None-Match "";
            proxy_set_header If-Modified-Since "";
            proxy_set_header If-Match "";
            proxy_set_header If-Unmodified-Since "";
            proxy_set_header If-Range "";
            add_header Cache-Control "no-store" always;
            add_header X-Content-Type-Options "nosniff" always;
        }

        location = /health {
            proxy_pass http://rag_api/health;
            proxy_cache off;
            proxy_no_cache 1;
            proxy_cache_bypass 1;
            proxy_hide_header Cache-Control;
            proxy_hide_header ETag;
            proxy_hide_header Last-Modified;
            proxy_ignore_headers X-Accel-Redirect X-Accel-Expires;
            proxy_set_header If-None-Match "";
            proxy_set_header If-Modified-Since "";
            add_header Cache-Control "no-store" always;
        }

        location = / {
            try_files /index.html =404;
            add_header Cache-Control "no-store" always;
            add_header X-Content-Type-Options "nosniff" always;
        }
        location = /index.html {
            try_files /index.html =404;
        }
        location / {
            proxy_pass http://rag_api;
            proxy_http_version 1.1;
            proxy_buffering off;
            proxy_request_buffering off;
            proxy_max_temp_file_size 0;
            proxy_next_upstream off;
            proxy_cache off;
            proxy_no_cache 1;
            proxy_cache_bypass 1;
            proxy_hide_header Cache-Control;
            proxy_hide_header ETag;
            proxy_hide_header Last-Modified;
            proxy_hide_header Expires;
            proxy_ignore_headers X-Accel-Redirect X-Accel-Expires;
            proxy_set_header If-None-Match "";
            proxy_set_header If-Modified-Since "";
            proxy_set_header If-Match "";
            proxy_set_header If-Unmodified-Since "";
            proxy_set_header If-Range "";
            proxy_connect_timeout 3s;
            proxy_read_timeout 30s;
            proxy_send_timeout 30s;
        }

        location @gateway_private_404 {
            add_header Cache-Control "no-store" always;
            add_header X-Content-Type-Options "nosniff" always;
            return 404;
        }
    }
}
