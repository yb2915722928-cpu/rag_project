worker_processes 1;
pid /tmp/nginx.pid;
# Keep only critical process-level errors on stderr; request lines, query
# strings and upstream URLs are never logged (access_log is off).
error_log stderr crit;

events { worker_connections 256; }

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log off;
    sendfile on;
    server_tokens off;
    client_max_body_size 1m;
    # 2 x 8 KiB approximates the 16 KiB request-header ceiling.
    large_client_header_buffers 2 8k;
    client_body_timeout 15s;
    client_header_timeout 10s;
    send_timeout 30s;

    upstream rag_api { server api:8000; }
    # Cache policy depends on both the final status and the URI. Only a 200
    # response for hash-addressed build output is immutable; 403/405/5xx and
    # any unhashed path are no-store. The regex tokens are quoted because
    # "{8,}" would otherwise be parsed as a configuration block.
    map "$status:$uri" $public_asset_cache {
        default "no-store";
        "~^200:/assets/[A-Za-z0-9_-]+-[A-Za-z0-9_-]{8,}\.(?:css|js|png|jpg|jpeg|svg|woff2)$" "public, max-age=31536000, immutable";
    }

    server {
        listen 8443 ssl;
        ssl_certificate /run/tls/cert.pem;
        ssl_certificate_key /run/tls/key.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        root /usr/share/nginx/html;
        error_page 404 = @gateway_private_404;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
        etag off;
        if_modified_since off;

        # Public build assets only; private data never lives here.
        location /assets/ {
            try_files $uri =404;
            add_header Cache-Control $public_asset_cache always;
            add_header X-Content-Type-Options "nosniff" always;
        }

        # Every API response, including gateway errors, is private and uncached.
        location /api/ {
            proxy_pass http://rag_api;
            proxy_http_version 1.1;
            proxy_buffering off;
            proxy_request_buffering off;
            proxy_max_temp_file_size 0;
            proxy_next_upstream off;
            proxy_read_timeout 30s;
            proxy_send_timeout 30s;
            proxy_connect_timeout 3s;
            proxy_cache off;
            proxy_no_cache 1;
            proxy_cache_bypass 1;
            proxy_redirect off;
            proxy_set_header Host $host;
            proxy_set_header X-Request-ID $request_id;
            proxy_hide_header ETag;
            proxy_hide_header Last-Modified;
            proxy_hide_header Cache-Control;
            proxy_hide_header Expires;
            proxy_ignore_headers X-Accel-Redirect X-Accel-Expires;
            proxy_set_header If-None-Match "";
            proxy_set_header If-Modified-Since "";
            proxy_set_header If-Match "";
            proxy_set_header If-Unmodified-Since "";
            proxy_set_header If-Range "";
            add_header Cache-Control "no-store" always;
            add_header X-Content-Type-Options "nosniff" always;
        }

        # Original bytes are a separate bounded stream, not a JSON request.
        # The initial file limit is 20 MiB; do not inherit the 1 MiB JSON cap.
        location ~ "^/api/v1/web/document-candidates/[A-Za-z0-9_-]{1,64}/original$" {
            client_max_body_size 20m;
            client_body_timeout 60s;
            proxy_pass http://rag_api;
            proxy_http_version 1.1;
            proxy_buffering off;
            proxy_request_buffering off;
            proxy_max_temp_file_size 0;
            proxy_next_upstream off;
            proxy_read_timeout 120s;
            proxy_send_timeout 120s;
            proxy_connect_timeout 3s;
            proxy_cache off;
            proxy_no_cache 1;
            proxy_cache_bypass 1;
            proxy_redirect off;
            proxy_set_header Host $host;
            proxy_set_header X-Request-ID $request_id;
            proxy_hide_header ETag;
            proxy_hide_header Last-Modified;
            proxy_hide_header Cache-Control;
            proxy_hide_header Expires;
            proxy_ignore_headers X-Accel-Redirect X-Accel-Expires;
            proxy_set_header If-None-Match "";
            proxy_set_header If-Modified-Since "";
            proxy_set_header If-Match "";
            proxy_set_header If-Unmodified-Since "";
            proxy_set_header If-Range "";
            add_header Cache-Control "no-store" always;
            add_header X-Content-Type-Options "nosniff" always;
        }

        location = /health {
            proxy_pass http://rag_api/health;
            proxy_http_version 1.1;
            proxy_next_upstream off;
            proxy_redirect off;
            proxy_cache off;
            proxy_no_cache 1;
            proxy_cache_bypass 1;
            proxy_hide_header Cache-Control;
            proxy_hide_header ETag;
            proxy_hide_header Last-Modified;
            proxy_ignore_headers X-Accel-Redirect X-Accel-Expires;
            proxy_set_header If-None-Match "";
            proxy_set_header If-Modified-Since "";
            add_header Cache-Control "no-store" always;
            add_header X-Content-Type-Options "nosniff" always;
        }

        location = / {
            try_files /index.html =404;
            add_header Cache-Control "no-store" always;
            add_header X-Content-Type-Options "nosniff" always;
        }
        location = /index.html {
            try_files /index.html =404;
        }
        # Contract fixtures are an in-process test surface, never a public
        # gateway route. Fail closed even if a future deployment enables it.
        location ^~ /__maintenance/ {
            add_header Cache-Control "no-store" always;
            add_header X-Content-Type-Options "nosniff" always;
            return 404;
        }

        location = /api {
            return 404;
        }

        # Public SPA shell only. No private data is embedded at build time;
        # every data request still goes through the private API locations.
        location / {
            if ($request_method !~ "^(GET|HEAD)$") {
                return 404;
            }
            try_files $uri /index.html;
            add_header Cache-Control "no-store" always;
            add_header X-Content-Type-Options "nosniff" always;
        }

        location @gateway_private_404 {
            add_header Cache-Control "no-store" always;
            add_header X-Content-Type-Options "nosniff" always;
            return 404;
        }
    }
}
